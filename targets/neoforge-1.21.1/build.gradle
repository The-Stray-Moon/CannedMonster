plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

apply from: file('../../gradle/target-conventions/shared.gradle')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

platformJava {
    srcDirs '../../common/src/legacy/java', '../../common/src/modern/java'
}

sourceSets {
    bootstrap {
        compileClasspath += sourceSets.main.compileClasspath
    }
    test {
        compileClasspath += sourceSets.bootstrap.output + sourceSets.bootstrap.compileClasspath
        runtimeClasspath += sourceSets.bootstrap.output + sourceSets.bootstrap.compileClasspath
    }
}

def bootstrapJar = tasks.register('bootstrapJar', Jar) {
    from sourceSets.bootstrap.output
    archiveFileName = 'fusion-asm-dev.jar'
    destinationDirectory = layout.buildDirectory.dir('bootstrap')
    manifest.attributes('Automatic-Module-Name': 'cc.sighs.cannedmonster.bootstrap')
}

def gameJar = tasks.register('gameJar', Jar) {
    from sourceSets.main.output
    archiveFileName = 'game.jar'
    destinationDirectory = layout.buildDirectory.dir('embedded')
    manifest.attributes('FMLModType': 'MOD', 'Automatic-Module-Name': 'cc.sighs.cannedmonster')
}

tasks.named('jar', Jar).configure {
    def gameOutputs = sourceSets.main.output.files.collect { it.toPath() }
    exclude { entry -> gameOutputs.any { entry.file.toPath().startsWith(it) } }
    from sourceSets.bootstrap.output
    from(gameJar) { into 'META-INF/cannedmonster' }
    manifest.attributes('Automatic-Module-Name': 'cc.sighs.cannedmonster.bootstrap')
}

tasks.named('test', Test).configure {
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    systemProperty 'cannedmonster.test.artifact', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
}

def packagedRun = providers.gradleProperty('verifyPackagedMod').isPresent()
def prepareAsmRun = tasks.register('prepareAsmRun') {
    dependsOn(packagedRun ? tasks.named('jar') : bootstrapJar)
    doLast {
        def mods = file('run/mods')
        mods.mkdirs()
        delete new File(mods, packagedRun ? 'cannedmonster-asm-dev.jar' : 'cannedmonster-packaged.jar')
        delete new File(mods, packagedRun ? 'fusion-asm-dev.jar' : 'cannedmonster-packaged.jar')
        copy {
            from(packagedRun ? tasks.named('jar').get().archiveFile : bootstrapJar.get().archiveFile)
            into mods
            rename { packagedRun ? 'cannedmonster-packaged.jar' : 'cannedmonster-asm-dev.jar' }
        }
    }
}

tasks.withType(net.neoforged.moddevgradle.internal.RunGameTask).configureEach {
    dependsOn prepareAsmRun
}

tasks.named('sourcesJar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.bootstrap.allSource
}

neoForge {
    version = neoforge_121_version

    runs {
        client {
            client()
            gameDirectory = file('run')
            if (providers.gradleProperty('spaceTestHooks').isPresent()) {
                systemProperty 'cannedmonster.spaceTestHooks', 'true'
            }
            if (providers.gradleProperty('multiplayer').isPresent()) {
                programArgument '--quickPlayMultiplayer'
                programArgument '127.0.0.1:25565'
            }
        }

        client2 {
            client()
            gameDirectory = file('run-client2')
            programArgument '--username'
            programArgument 'Dev2'
            systemProperty 'autojs.port', '25586'
            if (providers.gradleProperty('spaceTestHooks').isPresent()) {
                systemProperty 'cannedmonster.spaceTestHooks', 'true'
            }
            if (providers.gradleProperty('multiplayer').isPresent()) {
                programArgument '--quickPlayMultiplayer'
                programArgument '127.0.0.1:25565'
            }
        }

        spaceTest {
            client()
            gameDirectory = file('run-space-test')
            programArgument '--username'
            programArgument 'SpaceTester'
            systemProperty 'autojs.port', '25587'
            if (providers.gradleProperty('spaceTestHooks').isPresent()) {
                systemProperty 'cannedmonster.spaceTestHooks', 'true'
            }
        }

        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
            systemProperty 'autojs.port', '25584'
            if (providers.gradleProperty('spaceTestHooks').isPresent()) {
                systemProperty 'cannedmonster.spaceTestHooks', 'true'
            }
        }
    }

    if (!providers.gradleProperty('verifyPackagedMod').isPresent()) {
        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }
}

if (providers.gradleProperty('verifyPackagedMod').isPresent()) {
    tasks.withType(net.neoforged.moddevgradle.internal.RunGameTask).configureEach {
        classpathProvider.setFrom(configurations.runtimeClasspath)
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            minecraft_version     : neoforge_121_minecraft_version,
            neoforge_version      : neoforge_121_version,
            neoforge_version_range: neoforge_121_version_range,
            mod_id                : mod_id,
            mod_name              : mod_name,
            mod_license           : mod_license,
            mod_version           : mod_version,
            mod_authors           : mod_authors,
            mod_description       : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties + [project: project]
    }
}

apply from: file('../../gradle/target-conventions/hot-debug.gradle')
apply from: file('../../gradle/target-conventions/publish.gradle')
