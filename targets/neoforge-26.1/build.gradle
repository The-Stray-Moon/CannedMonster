plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

apply from: file('../../gradle/target-conventions/shared.gradle')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

commonJava {
    // Files whose 1.21.1 implementation is confirmed incompatible with 26.1.
    exclude 'cc/sighs/cannedmonster/can/CanActions.java'
    exclude 'cc/sighs/cannedmonster/can/CanContents.java'
    exclude 'cc/sighs/cannedmonster/can/MonsterCanItem.java'
    exclude 'cc/sighs/cannedmonster/can/ThrownCan.java'
    exclude 'cc/sighs/cannedmonster/fusion/AttributeAverages.java'
    exclude 'cc/sighs/cannedmonster/fusion/FlightRules.java'
    exclude 'cc/sighs/cannedmonster/fusion/FusionGaze.java'
    exclude 'cc/sighs/cannedmonster/fusion/FusionMotion.java'
    exclude 'cc/sighs/cannedmonster/fusion/FusionPursuit.java'
    exclude 'cc/sighs/cannedmonster/fusion/FusionRiding.java'
    exclude 'cc/sighs/cannedmonster/fusion/FusionRuntime.java'
    exclude 'cc/sighs/cannedmonster/fusion/FusionSession.java'
    exclude 'cc/sighs/cannedmonster/fusion/FusionTraits.java'
    exclude 'cc/sighs/cannedmonster/fusion/HurtCalls.java'
    exclude 'cc/sighs/cannedmonster/fusion/InteractionCalls.java'
    exclude 'cc/sighs/cannedmonster/fusion/NativeLootAccess.java'
    exclude 'cc/sighs/cannedmonster/fusion/FusionLoot.java'
    exclude 'cc/sighs/cannedmonster/fusion/NativeAttributeAccess.java'
    exclude 'cc/sighs/cannedmonster/fusion/NativeMobAccess.java'
    exclude 'cc/sighs/cannedmonster/fusion/NativeRideAccess.java'
    exclude 'cc/sighs/cannedmonster/fusion/PlayerFusion.java'
    exclude 'cc/sighs/cannedmonster/fusion/PlayerSpeed.java'
    exclude 'cc/sighs/cannedmonster/fusion/RemovalCalls.java'
    exclude 'cc/sighs/cannedmonster/fusion/RidingState.java'
    exclude 'cc/sighs/cannedmonster/fusion/TeleportCalls.java'
    exclude 'cc/sighs/cannedmonster/fusion/visual/AppearanceSync.java'
    exclude 'cc/sighs/cannedmonster/fusion/visual/ClientAppearance.java'
    exclude 'cc/sighs/cannedmonster/fusion/visual/ClientRiding.java'
    exclude 'cc/sighs/cannedmonster/fusion/visual/DisplayExecution.java'
    exclude 'cc/sighs/cannedmonster/fusion/visual/FusionAppearance.java'
    exclude 'cc/sighs/cannedmonster/fusion/visual/FusionRenderer.java'
    exclude 'cc/sighs/cannedmonster/fusion/visual/MemberEffectRenderer.java'
    exclude 'cc/sighs/cannedmonster/fusion/visual/MemberEvent.java'
    exclude 'cc/sighs/cannedmonster/fusion/visual/SliceBuffers.java'
}

tasks.named('sourcesJar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def packagedRun = providers.gradleProperty('verifyPackagedMod').isPresent()

sourceSets {
    test {
        // Unit tests that touch Minecraft types need the game artifact at runtime as well.
        runtimeClasspath += sourceSets.main.compileClasspath
    }
}

neoForge {
    version = neoforge_261_version

    runs {
        client {
            client()
            gameDirectory = file('run')
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    if (!packagedRun) {
        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }
}

if (packagedRun) {
    def preparePackagedRun = tasks.register('preparePackagedRun') {
        dependsOn tasks.named('jar')
        doLast {
            def mods = file('run/mods')
            mods.mkdirs()
            delete new File(mods, 'cannedmonster-asm-dev.jar')
            copy {
                from tasks.named('jar').get().archiveFile
                into mods
                rename { 'cannedmonster-packaged.jar' }
            }
        }
    }
    tasks.withType(net.neoforged.moddevgradle.internal.RunGameTask).configureEach {
        dependsOn preparePackagedRun
        classpathProvider.setFrom(configurations.runtimeClasspath)
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            minecraft_version     : neoforge_261_minecraft_version,
            neoforge_version      : neoforge_261_version,
            neoforge_version_range: neoforge_261_version_range,
            mod_id                : mod_id,
            mod_name              : mod_name,
            mod_license           : mod_license,
            mod_version           : mod_version,
            mod_authors           : mod_authors,
            mod_description       : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties + [project: project]
    }
}

apply from: file('../../gradle/target-conventions/hot-debug.gradle')
apply from: file('../../gradle/target-conventions/publish.gradle')
