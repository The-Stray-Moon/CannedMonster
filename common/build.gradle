// Standalone build for the shared source tree.
//
// common/ holds the primary NeoForge 1.21.1 implementation. Files with a
// confirmed 1.20.1 difference are excluded by that target's commonJava block
// and replaced in targets/forge-1.20.1. This standalone build checks the
// shared tree against the primary target's NeoForge classpath:
//
//     gradlew -p common build
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

def properties = new Properties()
file('../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neoforge_version
    addModdingDependenciesTo(sourceSets.test)
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}
