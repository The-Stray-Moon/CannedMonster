// Standalone shared-core checks use the primary target's API backends and NeoForge classpath.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

def properties = new Properties()
file('../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

sourceSets.main.java.srcDirs 'src/legacy/java', 'src/modern/java',
        '../targets/neoforge-1.21.1/src/main/java/cc/sighs/cannedmonster/platform',
        '../targets/neoforge-1.21.1/src/main/java/cc/sighs/cannedmonster/can',
        '../targets/neoforge-1.21.1/src/main/java/cc/sighs/cannedmonster/fusion'

group = mod_group_id
version = mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neoforge_version
    addModdingDependenciesTo(sourceSets.test)
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}
